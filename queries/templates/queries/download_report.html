{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Download Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Download Reports</h2>
    <p>Select a date range and file type:</p>

    <!-- Form points to download_report -->
    <form method="get" action="/download-report/">
        <!-- Date Range -->
        <div class="mb-3">
            <label class="form-label">Date Range</label>
            <select class="form-select" id="date_range" name="range">
                <option value="today">Today</option>
                <option value="yesterday">Yesterday</option>
                <option value="last7">Last 7 Days</option>
                <option value="last30">Last 30 Days</option>
                <option value="custom">Custom</option>
            </select>
        </div>

        <!-- Custom Dates (hidden by default) -->
        <div class="mb-3 d-none" id="custom_dates">
            <label class="form-label">Custom Dates</label>
            <input type="date" class="form-control mb-2" name="start_date" placeholder="Start Date">
            <input type="date" class="form-control" name="end_date" placeholder="End Date">
        </div>

        <!-- Format -->
        <div class="mb-3">
            <label class="form-label">Format</label>
            <select class="form-select" name="format">
                <option value="pdf">PDF</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Generate Report</button>
    </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const dateRangeSelect = document.getElementById("date_range");
    const customDatesDiv = document.getElementById("custom_dates");

    dateRangeSelect.addEventListener("change", function () {
        if (this.value === "custom") {
            customDatesDiv.classList.remove("d-none");
        } else {
            customDatesDiv.classList.add("d-none");
        }
    });
});
</script>
</body>
</html>
