{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Functionality</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h2>Add New Functionality</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" name="date" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">FC ID & Name</label>
            <input type="text" name="fc_id_name" class="form-control"
                   placeholder="6347 - MMA MATRIX GYM BANGALORE" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description of Functionality</label>
            <textarea name="description" class="form-control" rows="6" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save Functionality</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back</a>
    </form>
</div>

</body>
</html>
